<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block titulo %}{% endblock %}
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilo.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body>

{% block contenido %}

{% endblock %}

<!-- JavaScript del proyecto -->

<script src="{{ url_for('static', filename='js/storage.js') }}"></script>

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>

<script src="{{ url_for('static', filename='js/wizard.js') }}"></script>

<script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
